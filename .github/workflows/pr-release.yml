name: Auto PR — Release to Master

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "release: ${{ github.ref_name }}" \
            --body "Automated PR: merges \`${{ github.ref_name }}\` into \`master\`." \
          || echo "PR already exists or could not be created — skipping."
