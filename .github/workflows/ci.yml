name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Using npm ci ensures a clean install based on your package-lock.json
        run: npm ci

      - name: Type Check
        # Uses the newly added typecheck script in package.json
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
