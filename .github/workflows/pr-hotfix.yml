name: Auto PR — Hotfix to Master and Develop

on:
  push:
    branches:
      - 'hotfix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "fix: ${{ github.ref_name }} → master" \
            --body "Automated PR: hotfix \`${{ github.ref_name }}\` → \`master\`. **Manual merge required.**" \
          || echo "PR to master already exists or could not be created — skipping."

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "fix: ${{ github.ref_name }} → develop" \
            --body "Automated PR: hotfix \`${{ github.ref_name }}\` → \`develop\`. **Manual merge required.**" \
          || echo "PR to develop already exists or could not be created — skipping."
